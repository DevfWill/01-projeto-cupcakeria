<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cupcakeria — Detalhes do Cupcake</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <h1 class="logo">🧁 Cupcakeria</h1>
      <p class="tagline">Cupcakes artesanais feitos com carinho</p>
      <nav id="site-nav" class="site-nav"></nav>
    </div>
  </header>

  <main class="container">
    <p><a href="index.html" class="link-btn">&larr; Voltar ao catálogo</a></p>
    <div id="product-status" class="catalog-status" role="status" aria-live="polite">Carregando...</div>
    <div id="product-detail" hidden></div>

    <section id="reviews-section" class="panel" hidden>
      <h2>Avaliações</h2>
      <div id="reviews-summary" class="muted" style="margin-bottom:12px;"></div>
      <div id="reviews-list"></div>

      <div id="review-form-wrap" style="margin-top:20px;border-top:1px solid var(--color-border);padding-top:16px;">
        <h3>Deixe sua avaliação</h3>
        <div id="review-alert"></div>
        <form id="review-form">
          <div class="form-group">
            <label for="review-rating">Nota</label>
            <select id="review-rating">
              <option value="5">5 - Excelente</option>
              <option value="4">4 - Muito bom</option>
              <option value="3">3 - Bom</option>
              <option value="2">2 - Regular</option>
              <option value="1">1 - Ruim</option>
            </select>
          </div>
          <div class="form-group">
            <label for="review-comment">Comentário (opcional)</label>
            <textarea id="review-comment" rows="3" maxlength="300" placeholder="O que você achou desse cupcake?"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Enviar avaliação</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Cupcakeria — Projeto acadêmico de Engenharia de Software I.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/produto.js"></script>
</body>
</html>
